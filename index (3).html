<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>For Maryam ❤️</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#06020c; --purple:#7b2ff2; --pink:#ff4fa3; --gold:#f1d9a8; --gold2:#c9a35e; --soft:#f6e4ee;
  --line:rgba(241,217,168,.3);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%;background:var(--bg);color:#fff;font-family:'Cairo','Segoe UI',Tahoma,Arial,sans-serif}
body{
  background:
    radial-gradient(1000px 700px at 12% 8%,rgba(123,47,242,.4),transparent 62%),
    radial-gradient(900px 700px at 92% 94%,rgba(255,79,163,.27),transparent 62%),
    radial-gradient(600px 420px at 50% 50%,rgba(241,217,168,.06),transparent 70%),
    var(--bg);
  background-attachment:fixed;overflow-x:hidden;
}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;box-shadow:inset 0 0 170px rgba(0,0,0,.8)}
#fx{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.fl{position:absolute;bottom:-40px;opacity:0;animation:rise linear infinite;filter:drop-shadow(0 0 7px currentColor)}
@keyframes rise{
  0%{transform:translateY(0) rotate(0);opacity:0}
  12%{opacity:.6}
  88%{opacity:.4}
  100%{transform:translateY(-115vh) rotate(300deg);opacity:0}
}
.page{
  position:relative;z-index:1;display:none;min-height:100vh;min-height:100dvh;
  padding:max(24px,env(safe-area-inset-top)) 18px max(28px,env(safe-area-inset-bottom));
  flex-direction:column;align-items:center;justify-content:center;gap:24px;text-align:center
}
.page.active{display:flex;animation:fade 1s cubic-bezier(.2,.7,.2,1)}
@keyframes fade{from{opacity:0;transform:translateY(16px);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}
.glass{
  position:relative;width:100%;max-width:460px;padding:32px 24px;border-radius:30px;
  background:linear-gradient(160deg,rgba(255,255,255,.1),rgba(255,255,255,.03));
  border:1px solid var(--line);
  -webkit-backdrop-filter:blur(22px) saturate(140%);backdrop-filter:blur(22px) saturate(140%);
  box-shadow:0 24px 60px rgba(0,0,0,.55),0 0 55px rgba(123,47,242,.3),inset 0 1px 0 rgba(255,255,255,.2)
}
h1{
  font-family:'Amiri','Cairo',serif;font-size:clamp(2.3rem,10vw,3.4rem);font-weight:700;line-height:1.3;
  background:linear-gradient(100deg,var(--gold),#ffb6d9,var(--gold),#d4b4ff,var(--gold));background-size:250% auto;
  -webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;
  animation:shine 7s linear infinite;filter:drop-shadow(0 0 18px rgba(255,79,163,.35))
}
h1::after{content:"✦  ❤  ✦";display:block;font-size:.75rem;letter-spacing:.5em;margin-top:2px;-webkit-text-fill-color:var(--gold2);color:var(--gold2)}
@keyframes shine{to{background-position:250% center}}
.fig{display:flex;flex-direction:column;align-items:center;width:100%}
.fig .tag{margin-top:24px}
.tag{font-family:'Amiri','Cairo',serif;font-size:1.25rem;line-height:1.9;max-width:420px;margin-top:-14px;color:var(--gold);text-shadow:0 0 18px rgba(255,79,163,.35)}
p.sub{color:var(--soft);font-size:1.12rem;line-height:1.9;margin-top:10px;letter-spacing:.02em}
input{
  width:100%;margin-top:20px;padding:15px 16px;border-radius:18px;font:inherit;font-size:1.25rem;
  text-align:center;letter-spacing:.35em;color:#fff;background:rgba(0,0,0,.5);
  border:1px solid var(--line);outline:none;transition:.3s
}
input:focus{border-color:var(--gold);box-shadow:0 0 0 4px rgba(241,217,168,.12),0 0 24px rgba(255,79,163,.45)}
.btn{
  position:relative;overflow:hidden;margin-top:16px;padding:14px 36px;cursor:pointer;
  border:1px solid rgba(241,217,168,.6);border-radius:999px;font:inherit;font-weight:700;font-size:1.05rem;color:#fff;
  background:linear-gradient(135deg,rgba(123,47,242,.95),rgba(255,79,163,.95));
  box-shadow:0 10px 30px rgba(255,79,163,.35),0 0 0 5px rgba(241,217,168,.06),inset 0 1px 0 rgba(255,255,255,.35);
  transition:transform .25s,box-shadow .25s
}
.btn::after{content:"";position:absolute;top:0;bottom:0;left:-80%;width:55%;transform:skewX(-20deg);
  background:linear-gradient(100deg,transparent,rgba(255,255,255,.38),transparent);transition:left .8s}
.btn:hover{transform:translateY(-2px);box-shadow:0 14px 38px rgba(255,79,163,.55),0 0 0 5px rgba(241,217,168,.1),inset 0 1px 0 rgba(255,255,255,.4)}
.btn:hover::after{left:135%}
.btn:active{transform:scale(.97)}
.btn:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.btn.ghost{background:rgba(255,255,255,.06);box-shadow:0 10px 26px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.2)}
.row{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
#err{color:#ffa0cc;margin-top:12px;min-height:1.6em;font-weight:600}
.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.photo,video{
  display:block;border-radius:22px;background:#000;border:1px solid rgba(241,217,168,.6);
  outline:1px solid rgba(241,217,168,.22);outline-offset:9px;
  box-shadow:0 28px 70px rgba(0,0,0,.65),0 0 70px rgba(255,79,163,.28)
}
.photo{max-width:calc(100% - 20px);max-height:60vh;max-height:60dvh;width:auto;height:auto;object-fit:contain;margin:10px}
.vwrap{width:100%;max-width:520px;padding:10px}
video{width:100%;max-height:50vh;max-height:50dvh}
audio{display:block;width:100%;height:54px;color-scheme:dark;border-radius:999px;box-shadow:0 0 0 1px rgba(241,217,168,.5),0 12px 36px rgba(255,79,163,.3)}
#msg{
  min-height:6em;text-align:right;white-space:pre-wrap;cursor:pointer;
  font-family:'Amiri','Cairo',serif;font-size:1.22rem;line-height:2.15;color:#fff7fb
}
#msg.typing::after{content:"❤";color:var(--pink);margin-right:4px;animation:blink .8s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.page:not(#login) .btn{margin-top:0}
@media (prefers-reduced-motion:reduce){.fl{display:none}h1{animation:none}.page.active{animation:none}}
</style>
</head>
<body>
<div id="fx" aria-hidden="true"></div>

<section class="page active" id="login">
  <div class="glass">
    <h1>يا مريم ❤️</h1>
    <p class="sub">عندي ليكي حاجة صغيرة 👀</p>
    <p class="sub">بس الأول اكتبي الباسورد 😂</p>
    <input id="pw" type="password" inputmode="numeric" autocomplete="off" placeholder="••••••" aria-label="الباسورد">
    <div id="err" role="alert"></div>
    <button class="btn" id="enter" type="button">ادخلي ❤️</button>
  </div>
</section>

<section class="page" id="p1">
  <h1>يا مريم ❤️</h1>
  <figure class="fig">
    <img class="photo" referrerpolicy="no-referrer" data-srcs="https://i.ibb.co/ynS2rwt1/1000967182.jpg" alt="صورة مريم">
    <figcaption class="tag">ضحكتك دي لوحدها كفاية تنوّر يومي ✨</figcaption>
  </figure>
  <div class="vwrap">
    <video id="vid1" controls playsinline preload="auto" src="https://files.catbox.moe/q29div.mp4"></video>
  </div>
  <button class="btn" data-snd="vid1" type="button">🔊 شغّلي الصوت</button>
  <div class="row"><button class="btn" data-go="p2" type="button">كمّلي 👀❤️</button></div>
</section>

<section class="page" id="p2">
  <h1>مريم ❤️</h1>
  <figure class="fig">
    <img class="photo" referrerpolicy="no-referrer" data-srcs="https://i.ibb.co/ZpdhbSds/1000967185.jpg" alt="صورة مريم">
    <figcaption class="tag">في حاجة فيكي بتخلّي الدنيا أهدى وأجمل 🌸</figcaption>
  </figure>
  <div class="vwrap">
    <video id="vid2" controls playsinline preload="auto" src="https://files.catbox.moe/shm1gx.mp4"></video>
  </div>
  <button class="btn" data-snd="vid2" type="button">🔊 شغّلي الصوت</button>
  <div class="row"><button class="btn ghost" data-go="p1" type="button">رجوع</button><button class="btn" data-go="p3" type="button">كمّلي ❤️</button></div>
</section>

<section class="page" id="p3">
  <h1>مريم ❤️</h1>
  <figure class="fig">
    <img class="photo" referrerpolicy="no-referrer" data-srcs="https://i.ibb.co/CpdxbZLS/1000967191.jpg" alt="صورة مريم">
    <figcaption class="tag">كل صورة ليكي بتبقى أحلى من اللي قبلها 💜</figcaption>
  </figure>
  <div class="row"><button class="btn ghost" data-go="p2" type="button">رجوع</button><button class="btn" data-go="p4" type="button">كمّلي ❤️</button></div>
</section>

<section class="page" id="p4">
  <h1>مريم ❤️</h1>
  <figure class="fig">
    <img class="photo" referrerpolicy="no-referrer" data-srcs="https://i.ibb.co/39z0QRJY/1000967202.jpg" alt="صورة مريم">
    <figcaption class="tag">ملامحك فيها حنية بتفضل في بالي 🤍</figcaption>
  </figure>
  <div class="row"><button class="btn ghost" data-go="p3" type="button">رجوع</button><button class="btn" data-go="p5" type="button">كمّلي ❤️</button></div>
</section>

<section class="page" id="p5">
  <h1>مريم ❤️</h1>
  <figure class="fig">
    <img class="photo" referrerpolicy="no-referrer" data-srcs="https://i.ibb.co/Zzv4X74g/1000967199.jpg" alt="صورة مريم">
    <figcaption class="tag">بساطتك هي أجمل حاجة فيكي ❤️</figcaption>
  </figure>
  <div class="row"><button class="btn ghost" data-go="p4" type="button">رجوع</button><button class="btn" data-go="p6" type="button">كمّلي ❤️</button></div>
</section>

<section class="page" id="p6">
  <h1>مريم ❤️</h1>
  <figure class="fig">
    <img class="photo" referrerpolicy="no-referrer" data-srcs="https://i.ibb.co/VcxBLNZj/1000967200.jpg" alt="صورة مريم">
    <figcaption class="tag">إنتي صدفة حلوة جاتلي في وقتها 🌹</figcaption>
  </figure>
  <div class="row"><button class="btn ghost" data-go="p5" type="button">رجوع</button><button class="btn" data-go="p7" type="button">الصفحة الأخيرة ❤️</button></div>
</section>

<section class="page" id="p7">
  <div class="glass"><div id="msg" aria-live="polite"></div></div>
  <div class="vwrap">
    <video id="vid" controls playsinline preload="auto" src="https://files.catbox.moe/cnhns7.mp4"></video>
  </div>
  <button class="btn" data-snd="vid" type="button">🔊 شغّلي الصوت</button>
  <div class="row"><button class="btn ghost" data-go="p6" type="button">رجوع</button></div>
</section>

<script>
(function(){
  var PASS = '1911';
  var MESSAGE =
"مريم... أنا حبيتك، وحبيت وجودك في حياتي. ❤️\n\n" +
"امبارح كان من أحلى أيامي، واتبسطت أوي إني قابلتك، وبصراحة لسه فرحان لحد دلوقتي.\n\n" +
"وفرحان بالبوسة اللي هتفضل في بالي، لأنها كانت لحظة بسيطة بس فرقت معايا جدًا. 🌹\n\n" +
"وبقيت أحس تجاهك بحنان وأمان كبير، وعايز أخاف عليكي وأحميكي وأفرّحك، وإنك قريبة من قلبي أكتر مما تتخيلي.\n\n" +
"وبتمنى نكمل ونعرف بعض أكتر، وده بيفرحني أوي. 💜\n\n" +
"شكرًا إنك بقيتي جزء من أيامي، وإنتي غالية عليا جدًا. ❤️";

  var $ = function(id){ return document.getElementById(id); };
  var all = function(sel){ return Array.prototype.slice.call(document.querySelectorAll(sel)); };
  var pages = all('.page').map(function(p){ return p.id; });
  var vids = all('video, audio');
  var msg = $('msg'), timer = null, chars = Array.from(MESSAGE);

  /* floating hearts & stars */
  var fx = $('fx'), icons = ['❤','✦','♥','✧','❤','✦'];
  for (var i = 0; i < 26; i++) {
    var s = document.createElement('span');
    var ic = icons[i % icons.length];
    s.className = 'fl' + (/[✦★✧]/.test(ic) ? ' star' : '');
    s.textContent = ic;
    s.style.left = (Math.random() * 100) + '%';
    s.style.fontSize = (10 + Math.random() * 16) + 'px';
    s.style.animationDuration = (9 + Math.random() * 12) + 's';
    s.style.animationDelay = (-Math.random() * 20) + 's';
    s.style.color = s.classList.contains('star') ? (i % 2 ? '#f1d9a8' : '#c9a7ff') : '#ff4fa3';
    fx.appendChild(s);
  }

  function stopTyping(){ if (timer) { clearInterval(timer); timer = null; } msg.classList.remove('typing'); }
  function resetVideos(){ vids.forEach(function(v){ try { v.pause(); v.currentTime = 0; } catch(e){} }); }

  function typeMessage(){
    stopTyping();
    msg.textContent = '';
    msg.classList.add('typing');
    var n = 0;
    timer = setInterval(function(){
      n++;
      msg.textContent = chars.slice(0, n).join('');
      if (n >= chars.length) stopTyping();
    }, 55);
  }

  function autoPlay(v){
    v.preload = 'auto';
    v.muted = false; v.volume = 1;
    try { v.currentTime = 0; } catch(e){}
    var p = v.play();
    if (p && p.catch) p.catch(function(){
      /* browser blocked sound: start muted, the sound button turns it on */
      v.muted = true;
      var q = v.play();
      if (q && q.catch) q.catch(function(){});
    });
  }

  function show(id){
    stopTyping();
    resetVideos();
    pages.forEach(function(p){ $(p).classList.toggle('active', p === id); });
    window.scrollTo(0, 0);
    var v = $(id).querySelector('video, audio');
    if (v) autoPlay(v);
    if (id === 'p7') typeMessage();
  }

  function normalize(v){
    return v.trim()
      .replace(/[٠-٩]/g, function(d){ return String(d.charCodeAt(0) - 1632); })
      .replace(/[۰-۹]/g, function(d){ return String(d.charCodeAt(0) - 1776); });
  }

  function login(){
    var box = document.querySelector('#login .glass');
    if (normalize($('pw').value) === PASS) {
      $('err').textContent = '';
      $('pw').value = '';
      show('p1');
    } else {
      $('err').textContent = 'لأ لأ 😂 الباسورد مش صح.';
      box.classList.remove('shake'); void box.offsetWidth; box.classList.add('shake');
    }
  }

  $('enter').addEventListener('click', login);
  $('pw').addEventListener('keydown', function(e){ if (e.key === 'Enter') login(); });
  all('[data-go]').forEach(function(b){ b.addEventListener('click', function(){ show(b.getAttribute('data-go')); }); });
  msg.addEventListener('click', function(){ if (timer) { stopTyping(); msg.textContent = MESSAGE; } });

  all('[data-snd]').forEach(function(b){
    b.addEventListener('click', function(){
      var v = $(b.getAttribute('data-snd'));
      vids.forEach(function(o){ if (o !== v) o.pause(); });
      v.muted = false; v.volume = 1;
      try { v.currentTime = 0; } catch(e){}
      var p = v.play();
      if (p && p.catch) p.catch(function(){
        alert('الفيديو مش بيشتغل. ممكن يكون الرابط انتهت صلاحيته أو النت ضعيف.');
      });
    });
  });

  /* image loader with a visible message if a link is dead */
  all('img[data-srcs]').forEach(function(img){
    var list = img.getAttribute('data-srcs').split('|'), k = 0;
    img.onerror = function(){
      k++;
      if (k < list.length) { img.src = list[k]; }
      else {
        img.onerror = null;
        img.removeAttribute('src');
        img.style.display = 'none';
        var m = document.createElement('p');
        m.className = 'sub';
        m.textContent = 'الصورة مش بتحمّل. اتأكدي من النت أو إن رابط الصورة لسه شغال.';
        img.parentNode.insertBefore(m, img);
      }
    };
    img.src = list[0];
  });

  document.addEventListener('visibilitychange', function(){ if (document.hidden) vids.forEach(function(v){ v.pause(); }); });
})();
</script>
</body>
</html>
